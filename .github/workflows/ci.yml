name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run unit test suite
        run: python -m unittest discover -s tests -v

      - name: Run prefix linter audit across repository
        run: python tools/antigravity_prefix_linter.py . --strict

      - name: Verify analytical simulation runs cleanly
        run: python proof/benchmark_proof.py

      - name: Test POSIX installer (dry-run)
        if: runner.os != 'Windows'
        run: bash install.sh --dry-run

      - name: Test Windows PowerShell installer (dry-run)
        if: runner.os == 'Windows'
        run: powershell -ExecutionPolicy Bypass -File install.ps1 -DryRun
